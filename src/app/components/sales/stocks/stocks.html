<div class="p-6">
  <div class="mb-4 flex justify-between items-center">
    <h2 class="text-3xl font-bold text-gray-800">Branch Stock</h2>
    <p-button label="Add Stock" icon="pi pi-plus" severity="success" />
  </div>
  
  <div *ngIf="loading" class="text-center p-8">
    <i class="pi pi-spin pi-spinner text-4xl text-blue-500"></i>
    <p class="mt-2 text-gray-600">Loading stocks...</p>
  </div>

  <div *ngIf="!loading && stocks.length === 0" class="text-center p-8 bg-gray-50 rounded-lg">
    <i class="pi pi-inbox text-6xl text-gray-400"></i>
    <p class="mt-4 text-gray-600">No stocks found</p>
  </div>

  <p-table 
    *ngIf="!loading && stocks.length > 0"
    [value]="stocks" 
    [paginator]="true" 
    [rows]="10"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [tableStyle]="{ 'min-width': '60rem' }"
    styleClass="p-datatable-striped">
    
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Product</th>
        <th>Branch</th>
        <th>Location</th>
        <th>Batch</th>
        <th>Quantity</th>
        <th>Min Quantity</th>
        <th>Status</th>
        <th style="width: 150px">Actions</th>
      </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-stock>
      <tr>
        <td>{{ stock.id }}</td>
        <td class="font-semibold">{{ stock.product }}</td>
        <td>{{ stock.branch }}</td>
        <td>{{ stock.location }}</td>
        <td>{{ stock.batch }}</td>
        <td class="font-bold">{{ stock.quantity }}</td>
        <td>{{ stock.minimum_quantity }}</td>
        <td>
          <p-tag [value]="stock.quantity <= stock.minimum_quantity ? 'Low Stock' : 'OK'" 
                [severity]="getStockSeverity(stock)" />
        </td>
        <td class="text-center">
          <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="info" size="small" class="mr-2" pTooltip="Edit" />
          <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" size="small" pTooltip="Delete" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
