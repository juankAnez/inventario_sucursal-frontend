<div class="dashboard-container">

  <!-- Header -->
  <header class="dashboard-header">
    <h1>¡Bienvenido nuevamente! 👋</h1>
    <p>Gestiona tu inventario de forma rápida y sencilla.</p>
  </header>

  <!-- Quick Actions -->
  <section class="quick-actions">
    <h2>Acciones rápidas</h2>

    <div class="actions-grid">

      <a routerLink="/productos" class="action-card">
        <div class="icon blue"><i class="pi pi-box"></i></div>
        <span>Productos</span>
      </a>

      <a routerLink="/ventas" class="action-card">
        <div class="icon green"><i class="pi pi-shopping-cart"></i></div>
        <span>Ventas</span>
      </a>

      <a routerLink="/sucursales" class="action-card">
        <div class="icon purple"><i class="pi pi-building"></i></div>
        <span>Sucursales</span>
      </a>

      <a routerLink="/usuarios" class="action-card">
        <div class="icon orange"><i class="pi pi-users"></i></div>
        <span>Usuarios</span>
      </a>

    </div>
  </section>

  <!-- Info Panel -->
  <section class="info-panel">
    <div class="info-box">
      <i class="pi pi-server"></i>
      <div>
        <h3>Estado del sistema</h3>
        <p class="status ok">API Online</p>
      </div>
    </div>

    <div class="info-box">
      <i class="pi pi-database"></i>
      <div>
        <h3>Base de datos</h3>
        <p>MySQL – Activa</p>
      </div>
    </div>

    <div class="info-box">
      <i class="pi pi-clock"></i>
      <div>
        <h3>Último acceso</h3>
        <p>{{ today | date:'medium' }}</p>
      </div>
    </div>
  </section>

</div>
