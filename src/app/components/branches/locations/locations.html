<div class="p-6">
  <div class="mb-4 flex justify-between items-center">
    <h2 class="text-3xl font-bold text-gray-800">Locations</h2>
    <p-button label="Add Location" icon="pi pi-plus" severity="success" />
  </div>
  
  <div *ngIf="loading" class="text-center p-8">
    <i class="pi pi-spin pi-spinner text-4xl text-blue-500"></i>
    <p class="mt-2 text-gray-600">Loading locations...</p>
  </div>

  <div *ngIf="!loading && locations.length === 0" class="text-center p-8 bg-gray-50 rounded-lg">
    <i class="pi pi-inbox text-6xl text-gray-400"></i>
    <p class="mt-4 text-gray-600">No locations found</p>
  </div>

  <p-table 
    *ngIf="!loading && locations.length > 0"
    [value]="locations" 
    [paginator]="true" 
    [rows]="10"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [tableStyle]="{ 'min-width': '50rem' }"
    styleClass="p-datatable-striped">
    
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Warehouse</th>
        <th>Code</th>
        <th>Description</th>
        <th style="width: 150px">Actions</th>
      </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-location>
      <tr>
        <td>{{ location.id }}</td>
        <td class="font-semibold">{{ location.warehouse }}</td>
        <td class="font-mono font-semibold">{{ location.code }}</td>
        <td>{{ location.description || 'No description' }}</td>
        <td class="text-center">
          <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="info" size="small" class="mr-2" pTooltip="Edit" />
          <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" size="small" pTooltip="Delete" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
