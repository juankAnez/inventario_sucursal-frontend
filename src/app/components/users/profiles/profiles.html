<div class="p-6">
  <div class="mb-4 flex justify-between items-center">
    <h2 class="text-3xl font-bold text-gray-800">Perfiles de Usuario</h2>
    <p-button label="Agregar Perfil" icon="pi pi-plus" severity="success" />
  </div>
  
  <div *ngIf="loading" class="text-center p-8">
    <i class="pi pi-spin pi-spinner text-4xl text-blue-500"></i>
    <p class="mt-2 text-gray-600">Cargando perfiles...</p>
  </div>

  <div *ngIf="!loading && profiles.length === 0" class="text-center p-8 bg-gray-50 rounded-lg">
    <i class="pi pi-inbox text-6xl text-gray-400"></i>
    <p class="mt-4 text-gray-600">No se encontraron perfiles</p>
  </div>

  <p-table 
    *ngIf="!loading && profiles.length > 0"
    [value]="profiles" 
    [paginator]="true" 
    [rows]="10"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    [tableStyle]="{ 'min-width': '50rem' }"
    styleClass="p-datatable-striped">
    
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Sucursal</th>
        <th>Teléfono</th>
        <th style="width: 150px">Acciones</th>
      </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-profile>
      <tr>
        <td>{{ profile.id }}</td>
        <td class="font-semibold">{{ profile.user }}</td>
        <td>{{ profile.branch || 'Sin asignar' }}</td>
        <td>{{ profile.phone || 'N/A' }}</td>
        <td class="text-center">
          <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="info" size="small" class="mr-2" pTooltip="Editar" />
          <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" size="small" pTooltip="Eliminar" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
