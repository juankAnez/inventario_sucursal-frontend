<div class="p-6">
  <div class="mb-4 flex justify-between items-center">
    <h2 class="text-3xl font-bold text-gray-800">Products</h2>
    <p-button label="Add Product" icon="pi pi-plus" severity="success" />
  </div>
  
  <div *ngIf="loading" class="text-center p-8">
    <i class="pi pi-spin pi-spinner text-4xl text-blue-500"></i>
    <p class="mt-2 text-gray-600">Loading products...</p>
  </div>

  <div *ngIf="!loading && products.length === 0" class="text-center p-8 bg-gray-50 rounded-lg">
    <i class="pi pi-inbox text-6xl text-gray-400"></i>
    <p class="mt-4 text-gray-600">No products found</p>
  </div>

  <p-table 
    *ngIf="!loading && products.length > 0"
    [value]="products" 
    [paginator]="true" 
    [rows]="10"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [tableStyle]="{ 'min-width': '60rem' }"
    styleClass="p-datatable-striped">
    
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Code</th>
        <th>Name</th>
        <th>Category</th>
        <th>Purchase Price</th>
        <th>Sale Price</th>
        <th>Status</th>
        <th style="width: 150px">Actions</th>
      </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-product>
      <tr>
        <td>{{ product.id }}</td>
        <td class="font-mono">{{ product.code }}</td>
        <td class="font-semibold">{{ product.name }}</td>
        <td>{{ product.category }}</td>
        <td>${{ product.purchase_price }}</td>
        <td>${{ product.sale_price }}</td>
        <td>
          <p-tag [value]="product.is_active ? 'Active' : 'Inactive'" 
                 [severity]="product.is_active ? 'success' : 'danger'" />
        </td>
        <td class="text-center">
          <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="info" size="small" class="mr-2" pTooltip="Edit" />
          <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" size="small" pTooltip="Delete" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
