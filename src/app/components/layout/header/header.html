<div class="w-full h-full flex items-center justify-between px-6 header-container">
  <!-- Logo en la izquierda -->
  <div class="flex items-center gap-4">
    <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center shadow-md">
      <i class="pi pi-box text-white text-xl"></i>
    </div>
  </div>

  <!-- Título CENTRADO -->
  <div class="absolute left-1/2 transform -translate-x-1/2">
    <div class="text-center">
      <h1 class="text-lg font-bold text-gray-800 m-0 leading-tight">Sistema de Inventario</h1>
      <p class="text-xs text-gray-500 m-0 leading-tight">Gestión Multi-Sucursal</p>
    </div>
  </div>
  
  <!-- Usuario y acciones a la derecha -->
  <div class="flex items-center gap-4">
    <!-- Información del usuario -->
    <div class="hidden md:flex items-center gap-3 bg-gray-50 px-4 py-2 rounded-lg border border-gray-200">
      <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full flex items-center justify-center">
        <i class="pi pi-user text-white text-sm"></i>
      </div>
      <div class="text-left">
        <p class="text-sm font-semibold text-gray-800 m-0 leading-tight">Usuario Admin</p>
        <p class="text-xs text-gray-500 m-0 leading-tight">Administrador</p>
      </div>
    </div>

    <!-- Botones de acción -->
    <button class="w-10 h-10 bg-gray-50 hover:bg-gray-100 rounded-lg flex items-center justify-center transition-all border border-gray-200 relative">
      <i class="pi pi-bell text-gray-700 text-lg"></i>
      <span class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center font-bold shadow-md">3</span>
    </button>
    
    <button class="w-10 h-10 bg-gray-50 hover:bg-gray-100 rounded-lg flex items-center justify-center transition-all border border-gray-200">
      <i class="pi pi-cog text-gray-700 text-lg"></i>
    </button>
  </div>
