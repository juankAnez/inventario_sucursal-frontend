<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Inventario de Sucursales | Sistema de Gestión</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sistema de gestión de inventario para múltiples sucursales con Django y Angular">
  <meta name="theme-color" content="#667eea">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Google Fonts - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- PrimeIcons -->
  <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css">
</head>
<body class="font-inter bg-gray-50">
  <app-root>
    <!-- Pantalla de carga mientras carga Angular -->
    <div style="
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-family: 'Inter', sans-serif;
    ">
      <div style="text-align: center;">
        <div style="
          width: 60px;
          height: 60px;
          border: 6px solid rgba(255,255,255,0.3);
          border-top-color: white;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin: 0 auto 20px;
        "></div>
        <h2 style="font-size: 24px; font-weight: 600; margin: 0;">
          Cargando Sistema de Inventario...
        </h2>
        <p style="margin-top: 10px; opacity: 0.8;">
          Por favor espera un momento
        </p>
      </div>
    </div>
  </app-root>
  
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</body>
</html>
